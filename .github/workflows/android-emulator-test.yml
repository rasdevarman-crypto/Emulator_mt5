name: Android Emulator Runtime Diagnostics

on:
  workflow_run:
    workflows: ["Android Build and GitHub Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Android Build and GitHub Release run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: android-emulator-diagnostics-${{ github.event.workflow_run.id || inputs.build_run_id || github.run_id }}
  cancel-in-progress: true

jobs:
  emulator-test:
    name: Install APK, verify runtime and probe PRoot
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_NAME: com.ras.mt5runner
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve source build run and download APK artifact
        id: apk
        shell: bash
        env:
          MANUAL_RUN_ID: ${{ inputs.build_run_id }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          run_id="${MANUAL_RUN_ID:-$UPSTREAM_RUN_ID}"
          test -n "$run_id"
          echo "Testing Android build run: $run_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/source-run.json"
          python3 - "$RUNNER_TEMP/source-run.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          print("Source run:", r.get("id"), r.get("name"), r.get("status"), r.get("conclusion"), r.get("head_sha"))
          if r.get("conclusion") != "success":
              raise SystemExit("Refusing to test an unsuccessful Android build run")
          PY
          mkdir -p "$RUNNER_TEMP/apk"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name MT5-RAS-Runner-debug-apk --dir "$RUNNER_TEMP/apk"
          apk="$(find "$RUNNER_TEMP/apk" -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          sha256sum "$apk" | tee "$RUNNER_TEMP/apk-sha256.txt"
          echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Inspect APK runtime payload, SHA-256, XZ integrity and native ABI
        id: payload
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/apk-inspect"
          unzip -Z1 "$APK_PATH" > "$RUNNER_TEMP/apk-entries.txt"
          if grep -qx 'assets/runtime/runtime-bundle.tar.xz' "$RUNNER_TEMP/apk-entries.txt"; then
            unzip -p "$APK_PATH" assets/runtime/runtime-bundle.tar.xz > "$RUNNER_TEMP/runtime-bundle.tar.xz"
            unzip -p "$APK_PATH" assets/runtime/runtime-bundle.tar.xz.sha256 | tr -d '\r\n ' > "$RUNNER_TEMP/embedded.sha256"
            actual="$(sha256sum "$RUNNER_TEMP/runtime-bundle.tar.xz" | awk '{print $1}')"
            expected="$(cat "$RUNNER_TEMP/embedded.sha256")"
            echo "Embedded runtime SHA-256 expected=$expected actual=$actual"
            test "$expected" = "$actual"
            xz -t "$RUNNER_TEMP/runtime-bundle.tar.xz"
            echo "runtime_payload=verified" >> "$GITHUB_OUTPUT"
            echo "Runtime payload SHA-256 and full XZ integrity verified."
          else
            echo "runtime_payload=missing" >> "$GITHUB_OUTPUT"
            echo "::warning::APK does not embed runtime-bundle.tar.xz; runtime download/install will be attempted from inside the app."
          fi
          if grep -qx 'assets/runtime/proot/bin/proot' "$RUNNER_TEMP/apk-entries.txt"; then
            unzip -p "$APK_PATH" assets/runtime/proot/bin/proot > "$RUNNER_TEMP/proot"
            file "$RUNNER_TEMP/proot" | tee "$RUNNER_TEMP/proot-file.txt"
            readelf -h "$RUNNER_TEMP/proot" | tee "$RUNNER_TEMP/proot-elf.txt"
            if grep -q 'AArch64' "$RUNNER_TEMP/proot-elf.txt"; then
              echo "proot_abi=arm64-v8a" >> "$GITHUB_OUTPUT"
            else
              echo "proot_abi=unexpected" >> "$GITHUB_OUTPUT"
              echo "::warning::Bundled PRoot ELF is not AArch64; inspect proot-elf.txt."
            fi
          else
            echo "proot_abi=missing" >> "$GITHUB_OUTPUT"
            echo "::warning::APK has no assets/runtime/proot/bin/proot payload."
          fi

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android API 35 Emulator install, launch, runtime and PRoot checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -Eeuo pipefail
            mkdir -p "$RUNNER_TEMP/android-diagnostics"
            report="$RUNNER_TEMP/android-diagnostics/summary.txt"
            {
              echo "Source build run: ${{ github.event.workflow_run.id || inputs.build_run_id }}"
              echo "APK SHA-256: $APK_SHA256"
              echo "Emulator ABI list: $(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
              echo "Emulator primary ABI: $(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
              echo "Android API: $(adb shell getprop ro.build.version.sdk | tr -d '\r')"
              echo "Device: $(adb shell getprop ro.product.manufacturer | tr -d '\r') $(adb shell getprop ro.product.model | tr -d '\r')"
              echo "PRoot ELF ABI from APK: ${{ steps.payload.outputs.proot_abi }}"
              echo "Embedded runtime payload check: ${{ steps.payload.outputs.runtime_payload }}"
            } | tee "$report"

            adb logcat -c
            adb install -r "$APK_PATH" | tee "$RUNNER_TEMP/android-diagnostics/install.txt"
            adb shell monkey -p "$PACKAGE_NAME" 1 | tee "$RUNNER_TEMP/android-diagnostics/launch.txt"
            sleep 8
            adb shell pidof "$PACKAGE_NAME" | tee "$RUNNER_TEMP/android-diagnostics/app-pid.txt" || true
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "$RUNNER_TEMP/android-diagnostics/initial-ui.xml" >/dev/null 2>&1 || true

            # Run the in-app runtime download/install action through the real Android UI.
            python3 - "$RUNNER_TEMP/android-diagnostics/initial-ui.xml" <<'PY' > "$RUNNER_TEMP/android-diagnostics/runtime-button.txt" || true
            import re,sys,xml.etree.ElementTree as ET
            try:
                root=ET.parse(sys.argv[1]).getroot()
                for n in root.iter('node'):
                    t=n.attrib.get('text','')
                    if 'Runtime Download / Install' in t:
                        m=re.search(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                        if m:
                            x1,y1,x2,y2=map(int,m.groups()); print((x1+x2)//2,(y1+y2)//2); raise SystemExit(0)
            except Exception: pass
            raise SystemExit(1)
            PY
            if test -s "$RUNNER_TEMP/android-diagnostics/runtime-button.txt"; then
              read -r x y < "$RUNNER_TEMP/android-diagnostics/runtime-button.txt"
              adb shell input tap "$x" "$y"
              echo "Tapped Runtime Download / Install at $x,$y" | tee -a "$report"
              # Allow network, manifest validation, download, checksum and install to report.
              for i in $(seq 1 36); do
                sleep 10
                adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
                adb pull /sdcard/window.xml "$RUNNER_TEMP/android-diagnostics/runtime-ui.xml" >/dev/null 2>&1 || true
                if grep -Eqi 'Runtime install সম্পন্ন|Automatic runtime setup ব্যর্থ|not verified|SHA-256 mismatch|XZ archive|Permission denied|error=13' "$RUNNER_TEMP/android-diagnostics/runtime-ui.xml" 2>/dev/null; then
                  break
                fi
              done
              cp "$RUNNER_TEMP/android-diagnostics/runtime-ui.xml" "$RUNNER_TEMP/android-diagnostics/runtime-ui-after-download.xml" 2>/dev/null || true
            else
              echo "::warning::Could not locate runtime button in UI hierarchy; app launch will still be recorded."
            fi

            # Trigger the app's own runtime preflight/PRoot execution path.
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "$RUNNER_TEMP/android-diagnostics/preflight-ui.xml" >/dev/null 2>&1 || true
            python3 - "$RUNNER_TEMP/android-diagnostics/preflight-ui.xml" <<'PY' > "$RUNNER_TEMP/android-diagnostics/launch-button.txt" || true
            import re,sys,xml.etree.ElementTree as ET
            try:
                root=ET.parse(sys.argv[1]).getroot()
                for n in root.iter('node'):
                    t=n.attrib.get('text','')
                    if 'Windows চালু করুন' in t:
                        m=re.search(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                        if m:
                            x1,y1,x2,y2=map(int,m.groups()); print((x1+x2)//2,(y1+y2)//2); raise SystemExit(0)
            except Exception: pass
            raise SystemExit(1)
            PY
            if test -s "$RUNNER_TEMP/android-diagnostics/launch-button.txt"; then
              read -r x y < "$RUNNER_TEMP/android-diagnostics/launch-button.txt"
              adb shell input tap "$x" "$y"
              echo "Tapped Windows launch / runtime preflight at $x,$y" | tee -a "$report"
              sleep 25
            fi

            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "$RUNNER_TEMP/android-diagnostics/final-ui.xml" >/dev/null 2>&1 || true
            adb logcat -d -v threadtime > "$RUNNER_TEMP/android-diagnostics/logcat.txt"
            adb shell dumpsys activity activities > "$RUNNER_TEMP/android-diagnostics/activities.txt" || true
            adb shell dumpsys package "$PACKAGE_NAME" > "$RUNNER_TEMP/android-diagnostics/package.txt" || true

            if grep -Eqi 'Permission denied|error=13|EACCES' "$RUNNER_TEMP/android-diagnostics/"*.xml "$RUNNER_TEMP/android-diagnostics/logcat.txt"; then
              echo "PRoot/permission error signature: DETECTED" | tee -a "$report"
            else
              echo "PRoot/permission error signature: NOT DETECTED in captured UI/logcat (not proof of successful PRoot execution)" | tee -a "$report"
            fi
            if grep -Eqi 'FATAL EXCEPTION|Process: com\.ras\.mt5runner' "$RUNNER_TEMP/android-diagnostics/logcat.txt"; then
              echo "Application crash: DETECTED" | tee -a "$report"
              echo "::error::Android app crash detected; see diagnostics artifact."
              exit 1
            fi
            if grep -qi 'AArch64' "$RUNNER_TEMP/proot-elf.txt" 2>/dev/null && ! grep -qi 'arm64-v8a' <<< "$(adb shell getprop ro.product.cpu.abilist)"; then
              echo "Architecture mismatch: ARM64 PRoot but emulator ABI list lacks arm64-v8a." | tee -a "$report"
              echo "::warning::Architecture mismatch: APK PRoot is AArch64 but Android Emulator does not advertise arm64-v8a."
            fi
            echo "Android install/launch and diagnostics collection completed." | tee -a "$report"

      - name: Collect diagnostics even after emulator/test failure
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/android-diagnostics"
          {
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "APK SHA-256: ${APK_SHA256:-not available}"
          } >> "$RUNNER_TEMP/android-diagnostics/summary.txt"
          if command -v adb >/dev/null 2>&1; then
            adb logcat -d -v threadtime > "$RUNNER_TEMP/android-diagnostics/logcat-finally.txt" 2>&1 || true
          fi
          cp "$RUNNER_TEMP/proot-elf.txt" "$RUNNER_TEMP/android-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP/proot-file.txt" "$RUNNER_TEMP/android-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP/apk-sha256.txt" "$RUNNER_TEMP/android-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP/source-run.json" "$RUNNER_TEMP/android-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP/embedded.sha256" "$RUNNER_TEMP/android-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP/apk-entries.txt" "$RUNNER_TEMP/android-diagnostics/" 2>/dev/null || true

      - name: Upload Android emulator diagnostic report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-emulator-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/android-diagnostics/
          if-no-files-found: warn
          retention-days: 14
