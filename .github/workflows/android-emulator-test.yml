name: Android Emulator Runtime Diagnostics

on:
  workflow_run:
    workflows: ["Android Build and GitHub Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Android Build and GitHub Release run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: android-emulator-diagnostics-${{ github.event.workflow_run.id || inputs.build_run_id || github.run_id }}
  cancel-in-progress: true

jobs:
  emulator-test:
    name: Install APK, verify runtime and probe PRoot
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGE_NAME: com.ras.mt5runner
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve source build run and download APK artifact
        id: apk
        shell: bash
        env:
          MANUAL_RUN_ID: ${{ inputs.build_run_id }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          run_id="${MANUAL_RUN_ID:-$UPSTREAM_RUN_ID}"
          test -n "$run_id"
          echo "Testing Android build run: $run_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/source-run.json"
          python3 - "$RUNNER_TEMP/source-run.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          print("Source run:", r.get("id"), r.get("name"), r.get("status"), r.get("conclusion"), r.get("head_sha"))
          if r.get("conclusion") != "success":
              raise SystemExit("Refusing to test an unsuccessful Android build run")
          PY
          mkdir -p "$RUNNER_TEMP/apk"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name MT5-RAS-Runner-debug-apk --dir "$RUNNER_TEMP/apk"
          apk="$(find "$RUNNER_TEMP/apk" -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          sha256sum "$apk" | tee "$RUNNER_TEMP/apk-sha256.txt"
          echo "APK_SHA256=$(sha256sum "$apk" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Inspect APK runtime payload, SHA-256, XZ integrity and native ABI
        id: payload
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/apk-inspect" "$RUNNER_TEMP/android-diagnostics"
          unzip -Z1 "$APK_PATH" > "$RUNNER_TEMP/apk-entries.txt"
          if grep -qx 'assets/runtime/runtime-bundle.tar.xz' "$RUNNER_TEMP/apk-entries.txt"; then
            unzip -p "$APK_PATH" assets/runtime/runtime-bundle.tar.xz > "$RUNNER_TEMP/runtime-bundle.tar.xz"
            unzip -p "$APK_PATH" assets/runtime/runtime-bundle.tar.xz.sha256 | tr -d '\r\n ' > "$RUNNER_TEMP/embedded.sha256"
            actual="$(sha256sum "$RUNNER_TEMP/runtime-bundle.tar.xz" | awk '{print $1}')"
            expected="$(cat "$RUNNER_TEMP/embedded.sha256")"
            echo "Embedded runtime SHA-256 expected=$expected actual=$actual"
            test "$expected" = "$actual"
            xz -t "$RUNNER_TEMP/runtime-bundle.tar.xz"
            echo "runtime_payload=verified" >> "$GITHUB_OUTPUT"
            echo "Runtime payload SHA-256 and full XZ integrity verified."
          else
            echo "runtime_payload=missing" >> "$GITHUB_OUTPUT"
            echo "::warning::APK does not embed runtime-bundle.tar.xz; runtime download/install will be attempted from inside the app."
          fi
          if grep -qx 'assets/runtime/proot/bin/proot' "$RUNNER_TEMP/apk-entries.txt"; then
            unzip -p "$APK_PATH" assets/runtime/proot/bin/proot > "$RUNNER_TEMP/proot"
            file "$RUNNER_TEMP/proot" | tee "$RUNNER_TEMP/proot-file.txt"
            readelf -h "$RUNNER_TEMP/proot" | tee "$RUNNER_TEMP/proot-elf.txt"
            if grep -q 'AArch64' "$RUNNER_TEMP/proot-elf.txt"; then
              echo "proot_asset_abi=arm64-v8a" >> "$GITHUB_OUTPUT"
            else
              echo "proot_asset_abi=unexpected" >> "$GITHUB_OUTPUT"
              echo "::warning::Bundled PRoot ELF is not AArch64; inspect proot-elf.txt."
            fi
          else
            echo "proot_asset_abi=missing" >> "$GITHUB_OUTPUT"
            echo "::warning::APK has no assets/runtime/proot/bin/proot payload."
          fi
          # Validate the ABI-specific executables actually launched by RuntimeManager.
          for abi in arm64-v8a x86_64; do
            entry="lib/$abi/libproot.so"
            loader_entry="lib/$abi/libproot_loader.so"
            grep -qx "$entry" "$RUNNER_TEMP/apk-entries.txt" || { echo "::error::Missing native PRoot for ABI $abi"; exit 1; }
            grep -qx "$loader_entry" "$RUNNER_TEMP/apk-entries.txt" || { echo "::error::Missing native PRoot loader for ABI $abi"; exit 1; }
            unzip -p "$APK_PATH" "$entry" > "$RUNNER_TEMP/proot-native-$abi"
            unzip -p "$APK_PATH" "$loader_entry" > "$RUNNER_TEMP/proot-loader-$abi"
            readelf -h "$RUNNER_TEMP/proot-native-$abi" | tee "$RUNNER_TEMP/android-diagnostics/proot-native-$abi-elf.txt"
            readelf -h "$RUNNER_TEMP/proot-loader-$abi" | tee "$RUNNER_TEMP/android-diagnostics/proot-loader-$abi-elf.txt"
            if [ "$abi" = "arm64-v8a" ]; then
              grep -q 'AArch64' "$RUNNER_TEMP/android-diagnostics/proot-native-$abi-elf.txt"
              grep -q 'AArch64' "$RUNNER_TEMP/android-diagnostics/proot-loader-$abi-elf.txt"
            else
              grep -q 'X86-64' "$RUNNER_TEMP/android-diagnostics/proot-native-$abi-elf.txt"
              grep -q 'X86-64' "$RUNNER_TEMP/android-diagnostics/proot-loader-$abi-elf.txt"
            fi
          done
          echo "proot_abi=arm64-v8a+x86_64" >> "$GITHUB_OUTPUT"

      - name: Preinstall Android emulator packages with retry and partial-download cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n1)"
          test -x "$sdkmanager_bin"
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses >/dev/null
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Preparing API 35 Google APIs x86_64 emulator packages attempt $attempt/3"
            if "$sdkmanager_bin" --install emulator "system-images;android-35;google_apis;x86_64"; then
              test -d "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
              test -x "$ANDROID_HOME/emulator/emulator"
              echo "API 35 emulator and system image packages verified."
              exit 0
            fi
            echo "::warning::Android emulator package install attempt $attempt failed; clearing incomplete emulator/system-image downloads."
            rm -rf "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
            rm -rf "$ANDROID_HOME/emulator"
            find "$ANDROID_HOME/.temp" -maxdepth 1 -type f \( -iname '*emulator*' -o -iname '*system-image*' -o -iname '*google_apis*' \) -delete 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not prepare Android API 35 emulator packages after three attempts."
          exit 1

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android API 35 Emulator install, launch, runtime and PRoot checks
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          SOURCE_BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
          PROOT_ELF_ABI: ${{ steps.payload.outputs.proot_abi }}
          RUNTIME_PAYLOAD_STATUS: ${{ steps.payload.outputs.runtime_payload }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          # The action splits this input into separate /usr/bin/sh -c calls. Keep this one command;
          # the real multiline POSIX script must execute from a file in one shell process.
          script: sh .github/scripts/android-emulator-test.sh

      - name: Collect diagnostics even after emulator/test failure
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/android-diagnostics"
          {
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "APK SHA-256: ${APK_SHA256:-not available}"
          } >> "$RUNNER_TEMP/android-diagnostics/summary.txt"
          # Never let a dead emulator/adb server stall the always() cleanup step.
          if command -v adb >/dev/null 2>&1; then
            timeout 15s adb devices -l > "$RUNNER_TEMP/android-diagnostics/adb-devices-finally.txt" 2>&1 || true
            timeout 20s adb logcat -d -v threadtime > "$RUNNER_TEMP/android-diagnostics/logcat-finally.txt" 2>&1 || true
            timeout 15s adb shell uiautomator dump /sdcard/window-finally.xml > "$RUNNER_TEMP/android-diagnostics/ui-dump-command-finally.txt" 2>&1 || true
            timeout 15s adb pull /sdcard/window-finally.xml "$RUNNER_TEMP/android-diagnostics/ui-finally.xml" >> "$RUNNER_TEMP/android-diagnostics/ui-dump-command-finally.txt" 2>&1 || true
            timeout 15s adb shell dumpsys activity activities > "$RUNNER_TEMP/android-diagnostics/activities-finally.txt" 2>&1 || true
            timeout 15s adb shell dumpsys package "${PACKAGE_NAME:-com.ras.mt5runner}" > "$RUNNER_TEMP/android-diagnostics/package-finally.txt" 2>&1 || true
          else
            echo "adb executable unavailable during cleanup" > "$RUNNER_TEMP/android-diagnostics/adb-unavailable-finally.txt"
          fi
          {
            echo "Diagnostics inventory UTC: $(date -u +%FT%TZ)"
            find "$RUNNER_TEMP/android-diagnostics" -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort || true
            echo "Missing log/UI evidence may mean the emulator stopped before adb could collect it; install/launch outputs are retained when their steps started."
          } >> "$RUNNER_TEMP/android-diagnostics/summary.txt"
          cp "$RUNNER_TEMP/proot-elf.txt" "$RUNNER_TEMP/android-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP/proot-file.txt" "$RUNNER_TEMP/android-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP/apk-sha256.txt" "$RUNNER_TEMP/android-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP/source-run.json" "$RUNNER_TEMP/android-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP/embedded.sha256" "$RUNNER_TEMP/android-diagnostics/" 2>/dev/null || true
          cp "$RUNNER_TEMP/apk-entries.txt" "$RUNNER_TEMP/android-diagnostics/" 2>/dev/null || true

      - name: Upload Android emulator diagnostic report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-emulator-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/android-diagnostics/
          if-no-files-found: warn
          retention-days: 14
