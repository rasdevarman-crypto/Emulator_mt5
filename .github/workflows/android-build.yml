name: Android Build and GitHub Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: Successful ARM64 smoke-test run ID carrying the verified bundle
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  # Push builds and the smoke-test-dispatched runtime build must not cancel each other.
  group: android-build-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Package latest verified runtime for the All-in-one APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-artifact" app/src/main/assets/runtime
          runtime_run_id="$REQUESTED_RUNTIME_RUN_ID"
          if [[ -z "$runtime_run_id" ]]; then
            # For ordinary pushes, use the newest successful ARM64 runtime smoke run on main.
            runtime_run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/06-arm64-smoke-test.yml/runs?branch=main&status=success&per_page=20" --jq '.workflow_runs | map(select(.conclusion == "success")) | first | .id // empty')"
          fi
          test -n "$runtime_run_id" || { echo "No successful ARM64 runtime smoke run found; refusing to build a misleading all-in-one APK." >&2; exit 1; }
          echo "Packaging runtime artifact from successful smoke run: $runtime_run_id"
          gh run download "$runtime_run_id" --repo "$GITHUB_REPOSITORY" \
            --name runtime-bundle-candidate --dir "$RUNNER_TEMP/runtime-artifact"
          cd "$RUNNER_TEMP/runtime-artifact"
          test -s runtime-bundle-candidate.tar.xz
          sha256sum -c runtime-bundle-candidate.tar.xz.sha256
          install -m 0644 runtime-bundle-candidate.tar.xz \
            "$GITHUB_WORKSPACE/app/src/main/assets/runtime/runtime-bundle.tar.xz"
          cd "$GITHUB_WORKSPACE"
          sha256sum app/src/main/assets/runtime/runtime-bundle.tar.xz
          sha256sum app/src/main/assets/runtime/runtime-bundle.tar.xz | awk '{print $1}' > app/src/main/assets/runtime/runtime-bundle.tar.xz.sha256

      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate runtime contract scripts and fixtures
        run: |
          bash -n scripts/check-runtime-bundle.sh
          bash -n scripts/verify-runtime-provenance.sh
          jq empty runtime/runtime-manifest.example.json

      - name: Validate Android runtime diagnostic guardrails
        shell: bash
        run: |
          set -Eeuo pipefail
          sh -n .github/scripts/android-emulator-test.sh
          grep -q 'Windows launch button intentionally NOT tapped' .github/scripts/android-emulator-test.sh
          if grep -Eq 'adb shell input tap.*Windows|adb shell input tap.*launch' .github/scripts/android-emulator-test.sh; then
            echo "::error::Android diagnostics must never tap the Windows/MT5 launch button."
            exit 1
          fi
          grep -q 'libfontconfig.so.1' app/src/main/java/com/ras/mt5runner/RuntimeManager.kt
          grep -q 'libfreetype.so.6' app/src/main/java/com/ras/mt5runner/RuntimeManager.kt
          grep -q 'libbrotlidec.so.1' app/src/main/java/com/ras/mt5runner/RuntimeManager.kt
          grep -q 'manifest status=' app/src/main/java/com/ras/mt5runner/RuntimeManager.kt
          echo "Runtime dependency, manifest and no-MT5-autolaunch guardrails validated."

      - name: Set up Android NDK for native PRoot
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n1)"
          test -x "$sdkmanager_bin"
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses >/dev/null
          set -o pipefail
          # SDK downloads can be transiently truncated; clear only the pinned NDK's
          # partial install/cache and retry before failing the native PRoot build.
          for attempt in 1 2 3; do
            echo "Installing pinned Android NDK attempt $attempt/3"
            if "$sdkmanager_bin" --install "ndk;28.2.13676358"; then
              test -x "$ANDROID_HOME/ndk/28.2.13676358/ndk-build"
              test -d "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt"
              echo "Pinned Android NDK installed and verified."
              exit 0
            fi
            echo "::warning::NDK install attempt $attempt failed; removing incomplete pinned NDK and retrying."
            rm -rf "$ANDROID_HOME/ndk/28.2.13676358"
            find "$ANDROID_HOME/.temp" -maxdepth 1 -type f \\( -iname '*ndk*' -o -iname '*28.2.13676358*' \\) -delete 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not install pinned Android NDK after three attempts."
          exit 1

      - name: Build pinned Android-native PRoot
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone https://github.com/berilevi/proot-static.git proot-static
          git -C proot-static checkout 6f8ebfd8e24887dfba64c3f2d7d5fe9dc059b60e
          cd proot-static
          # The pinned helper's build logic supports both NDK target triples; widen its ABI guard.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/build-static-aarch64.sh")
          source = p.read_text()
          old = 'if [[ "$ARCH" != "aarch64" ]]; then'
          new = 'if [[ "$ARCH" != "aarch64" && "$ARCH" != "x86_64" ]]; then'
          assert old in source, "Pinned PRoot helper ABI guard changed"
          p.write_text(source.replace(old, new, 1))
          PY
          NDK="$ANDROID_HOME/ndk/28.2.13676358" OUT="$RUNNER_TEMP/proot-build" REPO_ARTIFACT_DIR="$RUNNER_TEMP/proot-dist" tools/build-static-aarch64.sh
          ARCH=x86_64 API=21 NDK="$ANDROID_HOME/ndk/28.2.13676358" OUT="$RUNNER_TEMP/proot-build-x86_64" REPO_ARTIFACT_DIR="$RUNNER_TEMP/proot-dist-x86_64" tools/build-static-aarch64.sh
          cd "$GITHUB_WORKSPACE"
          mkdir -p app/src/main/assets/runtime/proot app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          cp -a "$RUNNER_TEMP/proot-build/root/." app/src/main/assets/runtime/proot/
          # Package both ABIs under nativeLibraryDir so execve never targets writable filesDir.
          install -m 0755 "$RUNNER_TEMP/proot-dist/proot" app/src/main/jniLibs/arm64-v8a/libproot.so
          install -m 0755 "$RUNNER_TEMP/proot-dist/loader" app/src/main/jniLibs/arm64-v8a/libproot_loader.so
          if test -f "$RUNNER_TEMP/proot-dist/loader32"; then install -m 0755 "$RUNNER_TEMP/proot-dist/loader32" app/src/main/jniLibs/arm64-v8a/libproot_loader32.so; fi
          install -m 0755 "$RUNNER_TEMP/proot-dist-x86_64/proot" app/src/main/jniLibs/x86_64/libproot.so
          install -m 0755 "$RUNNER_TEMP/proot-dist-x86_64/loader" app/src/main/jniLibs/x86_64/libproot_loader.so
          if test -f "$RUNNER_TEMP/proot-dist-x86_64/loader32"; then install -m 0755 "$RUNNER_TEMP/proot-dist-x86_64/loader32" app/src/main/jniLibs/x86_64/libproot_loader32.so; fi
          readelf -h app/src/main/jniLibs/arm64-v8a/libproot.so | tee /tmp/proot-arm64-elf.txt
          grep -q AArch64 /tmp/proot-arm64-elf.txt
          readelf -h app/src/main/jniLibs/arm64-v8a/libproot_loader.so | grep -q AArch64
          readelf -h app/src/main/jniLibs/x86_64/libproot.so | tee /tmp/proot-x86_64-elf.txt
          grep -q 'X86-64' /tmp/proot-x86_64-elf.txt
          readelf -h app/src/main/jniLibs/x86_64/libproot_loader.so | grep -q 'X86-64'
          sha256sum app/src/main/jniLibs/arm64-v8a/libproot.so | tee app/src/main/assets/runtime/proot/proot.sha256

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gradle --no-daemon assembleDebug

      - name: Verify runtime archive is embedded intact in the APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -Eeuo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | sort | head -n1)"
          test -s "$apk"
          expected="$(sha256sum app/src/main/assets/runtime/runtime-bundle.tar.xz | awk '{print $1}')"
          test "$(cat app/src/main/assets/runtime/runtime-bundle.tar.xz.sha256)" = "$expected"
          unzip -l "$apk" | awk '$4 == "assets/runtime/runtime-bundle.tar.xz" { found=1 } END { exit !found }'
          unzip -l "$apk" | awk '$4 == "assets/runtime/runtime-bundle.tar.xz.sha256" { found=1 } END { exit !found }'
          actual="$(unzip -p "$apk" assets/runtime/runtime-bundle.tar.xz | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"
          unzip -p "$apk" assets/runtime/runtime-bundle.tar.xz | xz -t -
          echo "Embedded runtime archive SHA-256 verified: $actual"
          ls -lh "$apk"

      - name: Build versioned APKs for version tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be vMAJOR.MINOR.PATCH (optional prerelease suffix), got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gradle --no-daemon -PversionName="$version" -PversionCode="$GITHUB_RUN_NUMBER" assembleDebug assembleRelease
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk "release-assets/MT5-RAS-Runner-${GITHUB_REF_NAME}-release.apk"
          cp app/build/outputs/apk/debug/*.apk "release-assets/MT5-RAS-Runner-${GITHUB_REF_NAME}-debug.apk"
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh release-assets

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MT5-RAS-Runner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload versioned release assets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: versioned-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release (physical-device validation gated)
    needs: build
    # Fail closed: set repository Actions variable MT5_DEVICE_VALIDATION_PASSED=true
    # only after reviewing evidence from a real ARM64 Android device and successful MT5 tests.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' && vars.MT5_DEVICE_VALIDATION_PASSED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: versioned-release-assets
          path: release-assets

      - name: Publish versioned APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MT5 RAS Runner ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/MT5-RAS-Runner-${{ github.ref_name }}-release.apk
            release-assets/MT5-RAS-Runner-${{ github.ref_name }}-debug.apk
            release-assets/SHA256SUMS.txt
          body: |
            Android build for ${{ github.ref_name }}. GitHub Release publication is gated by the repository Actions variable `MT5_DEVICE_VALIDATION_PASSED=true`, which must only be set after real-device Wine/Box64/MT5 validation evidence has been reviewed.

            - APKs are built with the CI debug signing key and are test builds, not production-signed releases.
            - The Debug APK is attached for diagnostics.
            - SHA256 checksums are included.
            - Do not claim MT5 compatibility unless physical-device validation evidence is available.
