name: Android Debug APK
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n scripts/check-runtime-bundle.sh scripts/verify-runtime-provenance.sh
      - name: Validate example manifest JSON
        run: jq empty runtime/runtime-manifest.example.json
      - name: Confirm empty bundle is reported as not ready
        shell: bash
        run: |
          set +e
          output="$(bash scripts/check-runtime-bundle.sh runtime/bundle 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          grep -q "No runtime bundle found" <<< "$output"
      - name: Confirm example manifest cannot pass provenance checks
        shell: bash
        run: |
          mkdir -p runtime/bundle/bin runtime/bundle/rootfs
          cp runtime/runtime-manifest.example.json runtime/bundle/manifest.json
          printf '#!/bin/sh\nexit 0\n' > runtime/bundle/bin/box64
          printf '#!/bin/sh\nexit 0\n' > runtime/bundle/bin/wine
          chmod +x runtime/bundle/bin/box64 runtime/bundle/bin/wine
          set +e
          output="$(bash scripts/verify-runtime-provenance.sh runtime/bundle 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -q "manifest status must be candidate or ready-for-review" <<< "$output"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MT5-RAS-Runner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
