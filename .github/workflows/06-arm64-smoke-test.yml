name: 06 ARM64 Runtime Smoke Test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/06-arm64-smoke-test.yml"
      - ".github/workflows/android-build.yml"
      - "app/build.gradle.kts"
      - "app/src/main/java/com/ras/mt5runner/**"
      - "app/src/main/AndroidManifest.xml"
      - "gradle.properties"
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: Successful runtime-bundle packaging run ID (auto-select latest on blank)
        required: false
        type: string
permissions:
  contents: read
  actions: write
concurrency:
  group: split-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  BOX64_COMMIT: "2f130fab1d6e1a4ee8a71dc60cfdfcc839ad192a"
  WINE_VERSION: "11.0"
  WINE_SHA256: "c07a6857933c1fc60dff5448d79f39c92481c1e9db5aa628db9d0358446e0701"
jobs:
  arm64-runtime-smoke:
    name: ARM64 Linux smoke test for Box64 + Wine
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Resolve successful runtime package run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.upstream_run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_id="$REQUESTED_RUN_ID"
          if [[ -z "$run_id" ]]; then
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 05-runtime-package.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "No successful runtime package run ID found: '$run_id'" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using successful runtime package run: $run_id"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: runtime-bundle-candidate
          path: build
      - name: Extract candidate and run Box64/Wine PE smoke tests on ARM64 host
        shell: bash
        run: |
          set -Eeuo pipefail
          # Avoid running Box64 under PRoot's ptrace/signal interception: Box64's
          # native ARM64 process can fault when PRoot intercepts its SIGSEGV-based
          # dynarec handling. Run it natively inside the ARM64 rootfs using chroot.
          tar --exclude='bundle/rootfs/dev/*' --exclude='bundle/rootfs-arm64/dev/*' -xJf build/runtime-bundle-candidate.tar.xz
          host_rootfs="$PWD/bundle/rootfs-arm64"
          wine_rootfs="$PWD/bundle/rootfs"
          fixtures="$PWD/provenance/test-fixtures"
          test -x "$host_rootfs/usr/local/bin/box64"
          test -x "$wine_rootfs/opt/wine-11.0-wow64/bin/wine"
          sudo mkdir -p "$host_rootfs/x86root" "$host_rootfs/tests" "$host_rootfs/tmp/wine-smoke-prefix"
          sudo cp "$fixtures/runtime-smoke-x86_64.exe" "$host_rootfs/tests/"
          sudo cp "$fixtures/runtime-smoke-i386.exe" "$host_rootfs/tests/"
          # Keep the bind mounts scoped to this job and always unmount them.
          sudo mount --bind "$wine_rootfs" "$host_rootfs/x86root"
          sudo mount --bind /dev "$host_rootfs/dev"
          sudo mount -t proc proc "$host_rootfs/proc"
          cleanup() {
            sudo umount "$host_rootfs/proc" 2>/dev/null || true
            sudo umount "$host_rootfs/dev" 2>/dev/null || true
            sudo umount "$host_rootfs/x86root" 2>/dev/null || true
          }
          trap cleanup EXIT
          runtime_run() {
            sudo chroot "$host_rootfs" /usr/bin/env \
              BOX64_LD_LIBRARY_PATH=/x86root/lib/x86_64-linux-gnu:/x86root/usr/lib/x86_64-linux-gnu:/x86root/lib64:/x86root/opt/wine-11.0-wow64/lib:/x86root/opt/wine-11.0-wow64/lib/wine/x86_64-unix:/x86root/opt/wine-11.0-wow64/lib/wine/i386-unix \
              LD_LIBRARY_PATH=/x86root/opt/wine-11.0-wow64/lib/wine/x86_64-unix:/x86root/opt/wine-11.0-wow64/lib/wine/i386-unix:/x86root/opt/wine-11.0-wow64/lib \
              WINEPREFIX=/tmp/wine-smoke-prefix WINEDEBUG=-all HOME=/root \
              /usr/local/bin/box64 "$@"
          }
          runtime_run --version 2>&1 | tee box64-smoke-version.txt
          runtime_run /x86root/opt/wine-11.0-wow64/bin/wine --version 2>&1 | tee wine-under-box64-smoke.txt
          grep -q 'wine-11.0' wine-under-box64-smoke.txt
          runtime_run /x86root/opt/wine-11.0-wow64/bin/wineboot --init 2>&1 | tee wineboot-smoke.txt
          runtime_run /x86root/opt/wine-11.0-wow64/bin/wine /tests/runtime-smoke-x86_64.exe 2>&1 | tee pe-x86_64-smoke.txt
          grep -q 'RUNTIME_SMOKE_OK pointer_bits=64' pe-x86_64-smoke.txt
          runtime_run /x86root/opt/wine-11.0-wow64/bin/wine /tests/runtime-smoke-i386.exe 2>&1 | tee pe-i386-smoke.txt
          grep -q 'RUNTIME_SMOKE_OK pointer_bits=32' pe-i386-smoke.txt
          sha256sum box64-smoke-version.txt wine-under-box64-smoke.txt wineboot-smoke.txt pe-x86_64-smoke.txt pe-i386-smoke.txt > runtime-smoke.sha256
      - name: Upload ARM64 smoke-test evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: arm64-runtime-smoke-evidence
          path: |
            box64-smoke-version.txt
            wine-under-box64-smoke.txt
            wineboot-smoke.txt
            pe-x86_64-smoke.txt
            pe-i386-smoke.txt
            runtime-smoke.sha256
          if-no-files-found: warn
          retention-days: 7

      - name: Carry forward runtime-bundle-candidate artifact for Android packaging
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: runtime-bundle-candidate
          path: |
            build/runtime-bundle-candidate.tar.xz
            build/runtime-bundle-candidate.tar.xz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Dispatch runtime-inclusive Android build after smoke evidence and bundle upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f runtime_run_id="$GITHUB_RUN_ID"
