name: 04 Build ARM64 Host Rootfs
on:
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: Successful Box64 build run ID
        required: true
        type: string
permissions:
  contents: read
  actions: write
concurrency:
  group: split-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  BOX64_COMMIT: "2f130fab1d6e1a4ee8a71dc60cfdfcc839ad192a"
  WINE_VERSION: "11.0"
  WINE_SHA256: "c07a6857933c1fc60dff5448d79f39c92481c1e9db5aa628db9d0358446e0701"
jobs:
  build-arm64-host-rootfs:
    name: Build ARM64 glibc host rootfs for Box64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.upstream_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: box64-arm64-build-output
          path: build/box64-output
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.upstream_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: pinned-runtime-sources
          path: build/runtime-sources-pass/
          run-id: ${{ inputs.upstream_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          run-id: ${{ inputs.upstream_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: wine-11.0-wow64-x86_64-build-output
          path: build/wine-output-pass/
          run-id: ${{ inputs.upstream_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install rootfs tools
        run: sudo apt-get update && sudo apt-get install -y debootstrap xz-utils file binutils
      - name: Assemble and verify ARM64 Ubuntu rootfs
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo debootstrap --variant=minbase noble rootfs-arm64 http://ports.ubuntu.com/ubuntu-ports/
          sudo install -d rootfs-arm64/usr/local/bin
          sudo install -m 0755 /bin/bash rootfs-arm64/bin/bash
          sudo tar -xJf build/box64-output/box64-arm64-install-tree.tar.xz -C /tmp
          sudo install -m 0755 /tmp/usr/local/bin/box64 rootfs-arm64/usr/local/bin/box64
          sudo rm -rf /tmp/usr
          sudo chroot "$PWD/rootfs-arm64" /bin/bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
              sed -i "s/Components: main/Components: main universe/" /etc/apt/sources.list.d/ubuntu.sources
            else
              sed -i "s/ main$/ main universe/" /etc/apt/sources.list
            fi
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates file libc-bin proot libcapstone4 libepoxy0 libx11-6 libxext6 libxfixes3 libxrender1 libxrandr2 libxi6 libxinerama1 libxcursor1 libxkbcommon0 libvulkan1 libgl1 libgcc-s1 libstdc++6
            /usr/local/bin/box64 --version
            dpkg-query -W -f="\${binary:Package}=\${Version}\\n" | sort > /rootfs-apt-packages.txt
            apt-get clean
            rm -rf /var/lib/apt/lists/*
          '
          file rootfs-arm64/usr/local/bin/box64 | tee arm64-rootfs-box64-file.txt
          readelf -h rootfs-arm64/usr/local/bin/box64 | tee arm64-rootfs-box64-elf.txt
          grep -q AArch64 arm64-rootfs-box64-elf.txt
          sudo tar --numeric-owner --exclude='rootfs-arm64/dev/*' -cJf arm64-host-rootfs.tar.xz rootfs-arm64
          sha256sum arm64-host-rootfs.tar.xz > arm64-host-rootfs.tar.xz.sha256
      - name: Upload ARM64 host rootfs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: arm64-host-rootfs
          path: |
            arm64-host-rootfs.tar.xz
            arm64-host-rootfs.tar.xz.sha256
            arm64-rootfs-box64-file.txt
            arm64-rootfs-box64-elf.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Carry forward box64-arm64-build-output artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: box64-arm64-build-output
          path: build/box64-output/
          if-no-files-found: error
          retention-days: 7
      - name: Carry forward pinned-runtime-sources artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: pinned-runtime-sources
          path: build/runtime-sources-pass/
          if-no-files-found: error
          retention-days: 7
      - name: Carry forward wine-11.0-wow64-x86_64-build-output artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: wine-11.0-wow64-x86_64-build-output
          path: build/wine-output-pass/
          if-no-files-found: error
          retention-days: 7

      - name: Dispatch runtime packaging after rootfs artifacts are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run 05-runtime-package.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f upstream_run_id="$GITHUB_RUN_ID"
