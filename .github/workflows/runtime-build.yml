name: Experimental Wine WoW64 + Box64 Build
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "scripts/acquire-runtime-sources.sh"
      - ".github/workflows/runtime-build.yml"
permissions:
  contents: read
concurrency:
  group: runtime-build-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  BOX64_COMMIT: "2f130fab1d6e1a4ee8a71dc60cfdfcc839ad192a"
  WINE_VERSION: "11.0"
  WINE_SHA256: "c07a6857933c1fc60dff5448d79f39c92481c1e9db5aa628db9d0358446e0701"

jobs:
  acquire:
    name: Verify pinned source inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install source audit tools
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Acquire and verify source inputs
        run: |
          bash -n scripts/acquire-runtime-sources.sh
          bash scripts/acquire-runtime-sources.sh build/runtime-sources
          jq empty build/runtime-sources/source-audit.json
          test "$(jq -r '.box64.commit' build/runtime-sources/source-audit.json)" = "$BOX64_COMMIT"
          test "$(jq -r '.wine.version' build/runtime-sources/source-audit.json)" = "$WINE_VERSION"
          test "$(jq -r '.wine.source_archive_sha256' build/runtime-sources/source-audit.json)" = "$WINE_SHA256"
      - name: Upload verified source inputs
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: pinned-runtime-sources
          path: |
            build/runtime-sources/source-audit.json
            build/runtime-sources/wine-11.0.tar.xz
            build/runtime-sources/box64/
            !build/runtime-sources/box64/.git/**
          if-no-files-found: error
          retention-days: 7

  build-box64:
    name: Build Box64 for ARM64 glibc Linux
    needs: acquire
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pinned-runtime-sources
          path: build/runtime-sources
      - name: Install Box64 build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config libcapstone-dev libepoxy-dev libx11-dev libxext-dev libxfixes-dev libxrender-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libxkbcommon-dev libvulkan-dev file binutils jq
      - name: Configure, compile, and verify ARM64 Box64
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/box64-build logs/box64 stage/box64
          jq -r '.box64.commit' build/runtime-sources/source-audit.json | tee logs/box64/source-commit.txt
          test "$(jq -r '.box64.commit' build/runtime-sources/source-audit.json)" = "$BOX64_COMMIT"
          cmake -S build/runtime-sources/box64 -B build/box64-build \
            -DARM_DYNAREC=ON -DNOGIT=1 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            2>&1 | tee logs/box64/configure.log
          cmake --build build/box64-build --parallel 2 2>&1 | tee logs/box64/build.log
          DESTDIR="$PWD/stage/box64" cmake --install build/box64-build 2>&1 | tee logs/box64/install.log
          box64_bin="stage/box64/usr/local/bin/box64"
          test -x "$box64_bin"
          file "$box64_bin" | tee logs/box64/file.txt
          readelf -h "$box64_bin" | tee logs/box64/elf-header.txt
          grep -q 'AArch64' logs/box64/elf-header.txt
          "$box64_bin" --version 2>&1 | tee logs/box64/version.txt
          dpkg-query -W -f='${binary:Package}=${Version}\n' | sort > logs/box64/apt-packages.txt
          { cmake --version; gcc --version; jq -r '.box64.commit' build/runtime-sources/source-audit.json; } > logs/box64/toolchain.txt
          tar -cJf box64-arm64-install-tree.tar.xz -C stage/box64 usr/local
          sha256sum box64-arm64-install-tree.tar.xz > box64-arm64-install-tree.tar.xz.sha256
      - name: Upload Box64 build output and logs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: box64-arm64-build-output
          path: |
            box64-arm64-install-tree.tar.xz
            box64-arm64-install-tree.tar.xz.sha256
            logs/box64/
          if-no-files-found: warn
          retention-days: 7

  build-arm64-host-rootfs:
    name: Build ARM64 glibc host rootfs for Box64
    needs: [acquire, build-box64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: box64-arm64-build-output
          path: build/box64-output
      - name: Install rootfs tools
        run: sudo apt-get update && sudo apt-get install -y debootstrap xz-utils file binutils
      - name: Assemble and verify ARM64 Ubuntu rootfs
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo debootstrap --variant=minbase noble rootfs-arm64 http://ports.ubuntu.com/ubuntu-ports/
          sudo install -d rootfs-arm64/usr/local/bin
          sudo install -m 0755 /bin/bash rootfs-arm64/bin/bash
          sudo tar -xJf build/box64-output/box64-arm64-install-tree.tar.xz -C /tmp
          sudo install -m 0755 /tmp/usr/local/bin/box64 rootfs-arm64/usr/local/bin/box64
          sudo rm -rf /tmp/usr
          sudo chroot "$PWD/rootfs-arm64" /bin/bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
              sed -i "s/Components: main/Components: main universe/" /etc/apt/sources.list.d/ubuntu.sources
            else
              sed -i "s/ main$/ main universe/" /etc/apt/sources.list
            fi
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates file libc-bin proot libcapstone4 libepoxy0 libx11-6 libxext6 libxfixes3 libxrender1 libxrandr2 libxi6 libxinerama1 libxcursor1 libxkbcommon0 libvulkan1 libgl1 libgcc-s1 libstdc++6
            /usr/local/bin/box64 --version
            dpkg-query -W -f="\${binary:Package}=\${Version}\\n" | sort > /rootfs-apt-packages.txt
            apt-get clean
            rm -rf /var/lib/apt/lists/*
          '
          sudo chown -R "$USER":"$USER" rootfs-arm64
          file rootfs-arm64/usr/local/bin/box64 | tee arm64-rootfs-box64-file.txt
          readelf -h rootfs-arm64/usr/local/bin/box64 | tee arm64-rootfs-box64-elf.txt
          grep -q AArch64 arm64-rootfs-box64-elf.txt
          tar -cJf arm64-host-rootfs.tar.xz rootfs-arm64
          sha256sum arm64-host-rootfs.tar.xz > arm64-host-rootfs.tar.xz.sha256
      - name: Upload ARM64 host rootfs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: arm64-host-rootfs
          path: |
            arm64-host-rootfs.tar.xz
            arm64-host-rootfs.tar.xz.sha256
            arm64-rootfs-box64-file.txt
            arm64-rootfs-box64-elf.txt
          if-no-files-found: warn
          retention-days: 7

  package-rootfs-bundle:
    name: Assemble Ubuntu rootfs and candidate bundle
    needs: [build-box64, build-wine, build-arm64-host-rootfs]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: box64-arm64-build-output
          path: build/box64-output
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wine-11.0-wow64-x86_64-build-output
          path: build/wine-output
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pinned-runtime-sources
          path: build/runtime-sources
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: arm64-host-rootfs
          path: build/arm64-rootfs
      - name: Install rootfs tools
        run: sudo apt-get update && sudo apt-get install -y debootstrap proot file binutils jq xz-utils
      - name: Build Ubuntu 24.04 x86_64 rootfs and stage candidate bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bundle/bin bundle/rootfs provenance
          tar -xJf build/arm64-rootfs/arm64-host-rootfs.tar.xz -C bundle
          cp bundle/rootfs-arm64/rootfs-apt-packages.txt provenance/arm64-rootfs-apt-packages.txt
          mkdir -p bundle/provenance
          cp provenance/arm64-rootfs-apt-packages.txt bundle/provenance/
          tar -xJf build/box64-output/box64-arm64-install-tree.tar.xz -C bundle
          test -x bundle/usr/local/bin/box64
          install -m 0755 bundle/usr/local/bin/box64 bundle/bin/box64
          rm -rf bundle/usr
          sudo debootstrap --variant=minbase noble bundle/rootfs http://archive.ubuntu.com/ubuntu/
          sudo cp build/wine-output/wine-11.0-wow64-x86_64-install-tree.tar.xz bundle/
          sudo tar -xJf bundle/wine-11.0-wow64-x86_64-install-tree.tar.xz -C bundle/rootfs
          sudo rm bundle/wine-11.0-wow64-x86_64-install-tree.tar.xz
          sudo install -m 0755 /bin/bash bundle/rootfs/bin/bash
          sudo chroot "$PWD/bundle/rootfs" /bin/bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
              sed -i 's/Components: main/Components: main universe/' /etc/apt/sources.list.d/ubuntu.sources
            else
              sed -i 's/ main$/ main universe/' /etc/apt/sources.list
            fi
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates file libc-bin libasound2t64 libasound2-plugins libpulse0 libx11-6 libxext6 libxrender1 libxrandr2 libxi6 libxfixes3 libxcursor1 libxinerama1 libxkbcommon0 libgl1 libvulkan1 libfontconfig1 libfreetype6 libdbus-1-3 libgnutls30t64 libgphoto2-6t64 libldap2 libmpg123-0t64 libopenal1 libpcap0.8t64 libsane1 libudev1 libunwind8 libusb-1.0-0 libv4l-0 libxcomposite1 libxdamage1 libxkbfile1 libxml2 libxslt1.1 libxxf86vm1 zlib1g libgcc-s1 libstdc++6 libncurses6 libtinfo6 libfaudio0 libvkd3d1 libvkd3d-shader1
            dpkg-query -W -f="\${binary:Package}=\${Version}\n" | sort > /tmp/runtime-apt-packages.txt
            find /opt/wine-11.0-wow64 -type f -print0 | while IFS= read -r -d "" f; do
              if file "$f" | grep -q ELF; then
                deps="$(ldd "$f" 2>&1 || true)"
                if grep -q "not found" <<< "$deps"; then
                  printf "Unresolved shared library for %s:\\n%s\\n" "$f" "$deps" >&2
                  exit 1
                fi
              fi
            done
            apt-get clean
            rm -rf /var/lib/apt/lists/*
          '
          sudo cp bundle/rootfs/tmp/runtime-apt-packages.txt provenance/rootfs-apt-packages.txt
          mkdir -p bundle/provenance
          cp provenance/rootfs-apt-packages.txt bundle/provenance/rootfs-apt-packages.txt
          sudo rm bundle/rootfs/tmp/runtime-apt-packages.txt
          sudo chown -R "$USER":"$USER" bundle/rootfs
          mkdir -p bundle/rootfs/opt
          ln -s ../rootfs/opt/wine-11.0-wow64/bin/wine bundle/bin/wine
          cp build/runtime-sources/source-audit.json provenance/source-audit.json
          mkdir -p provenance/box64 provenance/wine provenance/test-fixtures
          cp build/box64-output/logs/box64/* provenance/box64/
          cp build/wine-output/logs/wine/* provenance/wine/
          cp build/wine-output/runtime-smoke-x86_64.exe provenance/test-fixtures/
          cp build/wine-output/runtime-smoke-i386.exe provenance/test-fixtures/
          cp build/box64-output/box64-arm64-install-tree.tar.xz.sha256 provenance/box64/ || true
          cp build/wine-output/wine-11.0-wow64-x86_64-install-tree.tar.xz.sha256 provenance/wine/ || true
          file bundle/bin/box64 | tee provenance/box64-file.txt
          readelf -h bundle/bin/box64 | tee provenance/box64-elf-header.txt
          grep -q AArch64 provenance/box64-elf-header.txt
          test -x bundle/rootfs/opt/wine-11.0-wow64/bin/wine
          test -f bundle/rootfs/etc/os-release
          grep -q 'VERSION_ID="24.04"' bundle/rootfs/etc/os-release
          wine_version="$(cat provenance/wine/version.txt 2>/dev/null || true)"
          if [[ -z "$wine_version" ]]; then wine_version="$(grep -hE 'wine-[0-9]+\.[0-9]+' provenance/wine/version.txt 2>/dev/null | head -n1 || true)"; fi
          [[ -n "$wine_version" ]] || wine_version="wine-11.0 (version output recorded in provenance)"
          box64_version="$(grep -hE 'v?0\.4\.4|Box64' provenance/box64/version.txt 2>/dev/null | head -n1 || true)"
          [[ -n "$box64_version" ]] || box64_version="Box64 v0.4.4 (version output recorded in provenance)"
          box64_sha="$(sha256sum bundle/bin/box64 | awk '{print $1}')"
          wine_sha="$(sha256sum bundle/bin/wine | awk '{print $1}')"
          jq -n             --arg box64_version "$box64_version"             --arg box64_sha "$box64_sha"             --arg wine_version "$wine_version"             --arg wine_sha "$wine_sha"             --arg box64_source "https://github.com/ptitSeb/box64"             --arg wine_source "https://dl.winehq.org/wine/source/11.0/wine-11.0.tar.xz"             --arg box64_commit "$BOX64_COMMIT"             --arg wine_archive_sha "$WINE_SHA256"             '{
              schema_version: 1,
              status: "candidate",
              target_android_abi: "arm64-v8a",
              box64: {path:"bin/box64", version:$box64_version, source_url:$box64_source, source_commit:$box64_commit, sha256:$box64_sha},
              wine: {path:"bin/wine", version:$wine_version, source_url:$wine_source, source_archive_sha256:$wine_archive_sha, sha256:$wine_sha},
              rootfs_path:"rootfs",
              rootfs:{distribution:"Ubuntu", version:"24.04", architecture:"amd64", packages_file:"provenance/rootfs-apt-packages.txt"},
              host_rootfs_path:"rootfs-arm64",
              host_rootfs:{distribution:"Ubuntu", version:"24.04", architecture:"arm64", packages_file:"provenance/arm64-rootfs-apt-packages.txt"},
              notes:"Experimental candidate assembled by CI. Not yet Android-device or MT5 validated; candidate status is not a compatibility claim."
            }' > bundle/manifest.json
          bash scripts/check-runtime-bundle.sh bundle
          bash scripts/verify-runtime-provenance.sh bundle
          tar -cJf runtime-bundle-candidate.tar.xz bundle provenance
          sha256sum runtime-bundle-candidate.tar.xz > runtime-bundle-candidate.tar.xz.sha256
      - name: Upload candidate bundle and provenance
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: runtime-bundle-candidate
          path: |
            runtime-bundle-candidate.tar.xz
            runtime-bundle-candidate.tar.xz.sha256
            provenance/
          if-no-files-found: warn
          retention-days: 7

  arm64-runtime-smoke:
    name: ARM64 Linux smoke test for Box64 + Wine
    needs: package-rootfs-bundle
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: runtime-bundle-candidate
          path: build
      - name: Install host PRoot
        run: sudo apt-get update && sudo apt-get install -y proot
      - name: Extract candidate and run Box64/Wine PE smoke tests in dual-rootfs layout
        shell: bash
        run: |
          set -Eeuo pipefail
          tar -xJf build/runtime-bundle-candidate.tar.xz
          test -x bundle/rootfs-arm64/usr/local/bin/box64
          mkdir -p wine-smoke-prefix
          host_rootfs="$PWD/bundle/rootfs-arm64"
          wine_rootfs="$PWD/bundle/rootfs"
          fixtures="$PWD/provenance/test-fixtures"
          proot_run() {
            proot -R "$host_rootfs" \
              -b "$wine_rootfs:/x86root" \
              -b "$fixtures:/tests" \
              -b "$PWD/wine-smoke-prefix:/wineprefix" \
              /usr/bin/env \
              BOX64_LD_LIBRARY_PATH=/x86root/lib/x86_64-linux-gnu:/x86root/usr/lib/x86_64-linux-gnu:/x86root/lib64:/x86root/opt/wine-11.0-wow64/lib \
              WINEPREFIX=/wineprefix WINEDEBUG=-all \
              /usr/local/bin/box64 "$@"
          }
          proot_run --version 2>&1 | tee box64-smoke-version.txt
          proot_run /x86root/opt/wine-11.0-wow64/bin/wine --version 2>&1 | tee wine-under-box64-smoke.txt
          grep -q 'wine-11.0' wine-under-box64-smoke.txt
          proot_run /x86root/opt/wine-11.0-wow64/bin/wineboot --init 2>&1 | tee wineboot-smoke.txt
          proot_run /x86root/opt/wine-11.0-wow64/bin/wine /tests/runtime-smoke-x86_64.exe 2>&1 | tee pe-x86_64-smoke.txt
          grep -q 'RUNTIME_SMOKE_OK pointer_bits=64' pe-x86_64-smoke.txt
          proot_run /x86root/opt/wine-11.0-wow64/bin/wine /tests/runtime-smoke-i386.exe 2>&1 | tee pe-i386-smoke.txt
          grep -q 'RUNTIME_SMOKE_OK pointer_bits=32' pe-i386-smoke.txt
          sha256sum box64-smoke-version.txt wine-under-box64-smoke.txt wineboot-smoke.txt pe-x86_64-smoke.txt pe-i386-smoke.txt > runtime-smoke.sha256
      - name: Upload ARM64 smoke-test evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: arm64-runtime-smoke-evidence
          path: |
            box64-smoke-version.txt
            wine-under-box64-smoke.txt
            wineboot-smoke.txt
            pe-x86_64-smoke.txt
            pe-i386-smoke.txt
            runtime-smoke.sha256
          if-no-files-found: warn
          retention-days: 7

  build-wine:
    name: Build Wine 11.0 new WoW64 for x86_64 Linux
    needs: acquire
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pinned-runtime-sources
          path: build/runtime-sources
      - name: Verify Wine source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "$WINE_SHA256  build/runtime-sources/wine-11.0.tar.xz" | sha256sum --check
          mkdir -p build/wine-source
          tar -xJf build/runtime-sources/wine-11.0.tar.xz --strip-components=1 -C build/wine-source
          grep -Fxq 'Wine version 11.0' build/wine-source/VERSION
      - name: Install Wine and MinGW build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get build-dep -y wine
          sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 pkg-config file binutils xz-utils
          mkdir -p logs/wine
          dpkg-query -W -f='${binary:Package}=${Version}\n' | sort > logs/wine/apt-packages.txt
          { gcc --version; make --version; i686-w64-mingw32-gcc --version; x86_64-w64-mingw32-gcc --version; } > logs/wine/toolchain.txt
      - name: Configure and compile new WoW64 Wine
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p stage/wine
          cd build/wine-source
          ./configure --enable-archs=i386,x86_64 --prefix=/opt/wine-11.0-wow64 \
            2>&1 | tee "$GITHUB_WORKSPACE/logs/wine/configure.log"
          grep -Eq 'i386 architecture: yes' "$GITHUB_WORKSPACE/logs/wine/configure.log"
          grep -Eq 'x86_64 architecture: yes' "$GITHUB_WORKSPACE/logs/wine/configure.log"
          printf '%s\n' './configure --enable-archs=i386,x86_64 --prefix=/opt/wine-11.0-wow64' > "$GITHUB_WORKSPACE/logs/wine/configure-args.txt"
          make -j2 2>&1 | tee "$GITHUB_WORKSPACE/logs/wine/build.log"
          make install DESTDIR="$GITHUB_WORKSPACE/stage/wine" 2>&1 | tee "$GITHUB_WORKSPACE/logs/wine/install.log"
          wine_bin="$GITHUB_WORKSPACE/stage/wine/opt/wine-11.0-wow64/bin/wine"
          test -x "$wine_bin"
          "$wine_bin" --version 2>&1 | tee "$GITHUB_WORKSPACE/logs/wine/version.txt"
          grep -q "wine-11.0" "$GITHUB_WORKSPACE/logs/wine/version.txt"
          file "$wine_bin" | tee "$GITHUB_WORKSPACE/logs/wine/file.txt"
          x86_64-w64-mingw32-gcc -O2 -s "$GITHUB_WORKSPACE/tests/runtime-smoke.c" -o "$GITHUB_WORKSPACE/runtime-smoke-x86_64.exe"
          i686-w64-mingw32-gcc -O2 -s "$GITHUB_WORKSPACE/tests/runtime-smoke.c" -o "$GITHUB_WORKSPACE/runtime-smoke-i386.exe"
          file "$GITHUB_WORKSPACE/runtime-smoke-x86_64.exe" "$GITHUB_WORKSPACE/runtime-smoke-i386.exe" | tee "$GITHUB_WORKSPACE/logs/wine/pe-smoke-fixtures.txt"
          tar -cJf "$GITHUB_WORKSPACE/wine-11.0-wow64-x86_64-install-tree.tar.xz" -C "$GITHUB_WORKSPACE/stage/wine" opt/wine-11.0-wow64
          cd "$GITHUB_WORKSPACE"
          sha256sum wine-11.0-wow64-x86_64-install-tree.tar.xz > wine-11.0-wow64-x86_64-install-tree.tar.xz.sha256
      - name: Upload Wine build output and logs
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: wine-11.0-wow64-x86_64-build-output
          path: |
            wine-11.0-wow64-x86_64-install-tree.tar.xz
            wine-11.0-wow64-x86_64-install-tree.tar.xz.sha256
            runtime-smoke-x86_64.exe
            runtime-smoke-i386.exe
            logs/wine/
          if-no-files-found: warn
          retention-days: 7
